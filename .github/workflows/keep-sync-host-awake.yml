# Keeps the Render free-tier sync host awake.
#
# Render spins a free web service down after ~15 minutes without inbound
# traffic, and waking takes ~1 minute. This ping keeps it warm so a room opens
# instantly. It is a safety net only — while anyone is watching, the WebSocket
# traffic already keeps the instance alive.
#
# Note: GitHub's scheduled workflows can be delayed during peak load and are
# paused after 60 days without repository activity. For a stricter schedule,
# point any free pinger (cron-job.org, UptimeRobot) at the same URL.
name: keep-sync-host-awake

on:
  schedule:
    # Render spins down after ~15 min idle; 5 min leaves room for GitHub's
    # scheduled-run delays (which can be several minutes at peak times).
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          url="${SYNC_HOST_URL:-https://moviegram-sync.onrender.com}/health"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$url")
          echo "$url -> $code"
          test "$code" = "200"
        env:
          SYNC_HOST_URL: ${{ vars.SYNC_HOST_URL }}
